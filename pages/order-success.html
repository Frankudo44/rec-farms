<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmed | REC Livestock &amp; Agro Farms</title>
  <meta name="robots" content="noindex"/>
  <link rel="icon" href="../assets/logo/rec-logo.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="../css/style.css?v=2026-10-12.4">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="section">
      <div class="container">
        <div class="confirm-card" id="confirm_card">
          <div class="check">
            <svg aria-hidden="true"><use href="../assets/icons/sprite.svg#i-check"></use></svg>
          </div>
          <span class="eyebrow" style="justify-content:center">Thank you</span>
          <h1 style="font-size:1.8rem">Order Received</h1>
          <p>Your order has been submitted to the REC team. Keep your order reference safe — we'll use it to track your order.</p>
          <div class="ref-box" id="order_ref">—</div>
          <div class="confirm-pickup" id="pickup_box" hidden>
            <h2>Pickup details</h2>
            <p><strong id="pickup_name"></strong></p>
            <p id="pickup_address" style="margin-bottom:.3rem"></p>
            <p style="font-size:.88rem;color:var(--muted)" id="pickup_hours"></p>
          </div>
          <div class="confirm-pay" id="confirm_pay" hidden>
            <h2>Payment</h2>
            <p style="font-size:.9rem;color:var(--muted)">Amount due: <strong id="pay_amount"></strong></p>
            <div id="pay_status"></div>
            <div style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:.8rem">
              <button class="btn btn-primary" id="pay_now" type="button">Pay Now with Paystack</button>
              <button class="btn btn-outline" id="pay_verify" type="button">I've paid — confirm</button>
            </div>
          </div>
          <p style="font-size:.9rem">We'll confirm your order shortly on <strong>WhatsApp</strong> or by <strong>phone</strong>.</p>
          <div style="display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:1.6rem">
            <a class="btn btn-whatsapp" id="order_wa" href="#" target="_blank" rel="noopener">
              <svg aria-hidden="true"><use href="../assets/icons/sprite.svg#i-whatsapp"></use></svg>
              Send Order via WhatsApp
            </a>
            <a class="btn btn-primary" href="../index.html">Back to Home</a>
            <a class="btn btn-outline" href="shop.html">Continue Shopping</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true"></div>

  <a class="wa-float" id="wa-float" href="#" target="_blank" rel="noopener" aria-label="Chat with REC on WhatsApp">
    <svg aria-hidden="true"><use href="../assets/icons/sprite.svg#i-whatsapp"></use></svg>
  </a>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="../js/app.js?v=2026-10-12.4"></script>
</body>
</html>
