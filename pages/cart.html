<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping Cart | REC Livestock &amp; Agro Farms</title>
  <meta name="description" content="Review your cart and proceed to checkout for farm products from REC Livestock & Agro Farms."/>
  <link rel="canonical" href="https://reclivestock.ng/cart.html"/>
  <link rel="icon" href="../assets/logo/rec-logo.jpg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="../css/style.css?v=2026-10-12.1">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-hero" aria-label="Cart">
      <div class="container">
        <div class="inner">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="../index.html">Home</a><span class="sep">/</span><a href="shop.html">Shop</a><span class="sep">/</span><span aria-current="page">Cart</span>
          </nav>
          <h1>Your Cart</h1>
          <p>Review your products before checkout.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <!-- Empty state -->
        <div id="cart_empty" class="empty-state" style="display:none;max-width:560px;margin:0 auto">
          <div class="e-icon"><svg style="width:34px;height:34px"><use href="../assets/icons/sprite.svg#i-cart-empty"></use></svg></div>
          <h4>Your cart is empty</h4>
          <p>Browse the farm shop and add some fresh products to get started.</p>
          <a class="btn btn-gold" style="margin-top:1rem" href="shop.html">Browse Products</a>
        </div>

        <div id="cart_filled" class="cart-layout" style="display:none">
          <div>
            <div class="cart-items" id="cart_items"></div>
            <button type="button" class="btn-link" id="clear_cart" style="margin-top:1.2rem">
              <svg aria-hidden="true" style="width:18px;height:18px"><use href="../assets/icons/sprite.svg#i-trash"></use></svg>
              Clear cart
            </button>
          </div>

          <aside class="cart-summary">
            <h3>Order Summary</h3>
            <div class="sum-row"><span>Subtotal</span><span id="sum_subtotal">₦0</span></div>
            <div class="sum-row"><span>Delivery</span><span>Calculated at checkout</span></div>
            <div class="sum-row total"><span>Total</span><b id="sum_total">₦0</b></div>
            <a class="btn btn-primary btn-block" href="checkout.html" style="margin-top:1.2rem">
              <svg aria-hidden="true"><use href="../assets/icons/sprite.svg#i-arrow-right"></use></svg>
              Proceed to Checkout
            </a>
            <a class="btn btn-outline btn-block" href="shop.html" style="margin-top:.7rem">Continue Shopping</a>
          </aside>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true"></div>

  <a class="wa-float" id="wa-float" href="#" target="_blank" rel="noopener" aria-label="Chat with REC on WhatsApp">
    <svg aria-hidden="true"><use href="../assets/icons/sprite.svg#i-whatsapp"></use></svg>
  </a>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/app.js?v=2026-10-11.1"></script>
</body>
</html>
